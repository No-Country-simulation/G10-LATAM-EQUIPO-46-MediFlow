[pytest]
# Pone src/ en sys.path para toda la suite.
#
# Hasta ahora las pruebas importaban "src.mediflow_agent.*" y el codigo de
# produccion importaba "mediflow_agent.*". Los dos caminos funcionaban por
# accidente, pero apuntan al mismo archivo por rutas distintas: Python los
# carga como dos modulos separados, con dos copias de cada clase Pydantic.
# Un isinstance() entre ambas devuelve False y el error es dificil de leer.
#
# Con esto, "mediflow_agent.*" funciona en todos lados y deja de hacer falta
# exportar PYTHONPATH a mano antes de correr pytest.
pythonpath = src
testpaths = tests
